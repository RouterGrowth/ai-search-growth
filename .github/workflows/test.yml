name: test
on:
  push:
    paths-ignore: ["data/**", "reports/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Configs are valid JSON
        run: python -c "import json; [json.load(open(f)) for f in ('config.json', 'prompts.json')]"
